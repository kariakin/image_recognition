
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Art Inspector — защита и проверка</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #home {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 20;
      background: #000;
      padding: 24px;
    }

    #home h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    #home .big {
      width: 80%;
      max-width: 320px;
      padding: 22px;
      font-size: 20px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      transition: opacity 0.3s, transform 0.3s;
    }

    #home .big:disabled {
      opacity: 0.3;
      transform: scale(0.95);
      cursor: not-allowed;
    }

    #btnProtect {
      background: #0a84ff;
      color: #fff;
    }

    #btnVerify {
      background: #30d158;
      color: #000;
    }

    #loadingOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 25;
      background: rgba(0, 0, 0, 0.95);
      padding: 24px;
    }

    #loadingTitle {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: #fff;
    }

    #loadingSubtitle {
      font-size: 16px;
      color: #aaa;
      text-align: center;
    }

    #progressContainer {
      width: 80%;
      max-width: 400px;
      height: 12px;
      background: #2c2c2e;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #progressBar {
      height: 100%;
      background: linear-gradient(90deg, #0a84ff, #30d158);
      width: 0%;
      transition: width 0.3s ease;
    }

    #progressBar.indeterminate {
      width: 30%;
      animation: indeterminate 1.5s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(400%);
      }
    }

    #progressInfo {
      font-size: 14px;
      color: #888;
      text-align: center;
      min-height: 20px;
    }

    #camera {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      z-index: 5;
    }

    #videoWrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: #111;
    }

    video {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .box {
      position: absolute;
      display: none;
      box-sizing: border-box;
      pointer-events: none;
    }

    #objectBox {
      border: 3px dashed #ffd60a;
    }

    #entropyBox {
      border: 3px solid #00ff66;
    }

    #entropyBox .ch {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 2px;
      background: #00ff66;
      transform: translate(-50%, -50%);
    }

    #entropyBox .cv {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 16px;
      background: #00ff66;
      transform: translate(-50%, -50%);
    }

    #entropyBox.target {
      border-color: #ffd60a;
    }

    #entropyBox.target .ch,
    #entropyBox.target .cv {
      background: #ffd60a;
    }

    #hint {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.35;
      z-index: 3;
    }

    #status {
      position: absolute;
      bottom: 4px;
      left: 8px;
      right: 8px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
      z-index: 3;
      pointer-events: none;
    }

    #controls {
      flex: 0 0 auto;
      padding: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #000;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      z-index: 3;
    }

    button {
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      background: #2c2c2e;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    button.primary {
      background: #0a84ff;
    }

    button.danger {
      background: #ff453a;
    }

    button:disabled {
      opacity: 0.4;
    }

    #modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 24px;
    }

    #modal .card {
      background: #1c1c1e;
      padding: 20px;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
    }

    #modal h2 {
      font-size: 18px;
      margin-bottom: 12px;
      text-align: center;
    }

    #modal p {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 16px;
      text-align: center;
      color: #ccc;
    }

    #modal input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background: #2c2c2e;
      color: #fff;
      font-size: 16px;
      margin-bottom: 12px;
    }

    #modal button {
      width: 100%;
      margin-top: 8px;
    }
      #modal p { white-space: pre-line; }
  </style>
</head>

<body>
  <div id="app">
    <div id="home">
      <h1>Art Inspector</h1>
      <button id="btnProtect" class="big" disabled>Защита</button>
      <button id="btnVerify" class="big" disabled>Проверка</button>
    </div>

    <div id="loadingOverlay">
      <div id="loadingTitle">Загрузка модулей</div>
      <div id="loadingSubtitle">Подготовка системы распознавания…</div>
      <div id="progressContainer">
        <div id="progressBar" class="indeterminate"></div>
      </div>
      <div id="progressInfo">Пожалуйста, подождите…</div>
      <button id="btnRetry" style="display:none;width:80%;max-width:320px;background:#0a84ff">Повторить</button>
    </div>

    <div id="camera">
      <div id="videoWrap">
        <video id="video" playsinline autoplay muted></video>
        <div id="overlay">
          <div id="objectBox" class="box"></div>
          <div id="entropyBox" class="box">
            <div class="ch"></div>
            <div class="cv"></div>
          </div>
        </div>
        <div id="hint"></div>
        <div id="status"></div>
      </div>
      <div id="controls">
        <button id="btnTorch">Фонарик</button>
        <button id="btnShot" class="primary">Фото</button>
        <button id="btnCancel" class="danger">Отмена</button>
      </div>
    </div>
    <div id="modal">
      <div class="card">
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
        <input id="modalInput" type="text" placeholder="Название картины" style="display:none;">
        <button id="modalOk" class="primary">OK</button>
      </div>
    </div>
  </div>
  <script>
    (() => {
// ==========================================================================
//  Art Inspector — логика приложения (реализация по спецификации README.md)
//
//  Состояния: idle -> detect -> (protect: zone_search | verify: lookup)
//             -> locked -> shoot -> process
// ==========================================================================

// ---------- DOM ----------
const home = document.getElementById('home');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingTitle = document.getElementById('loadingTitle');
const loadingSubtitle = document.getElementById('loadingSubtitle');
const progressBar = document.getElementById('progressBar');
const progressInfo = document.getElementById('progressInfo');
const cameraEl = document.getElementById('camera');
const video = document.getElementById('video');
const videoWrap = document.getElementById('videoWrap');
const objectBox = document.getElementById('objectBox');   // жёлтая пунктирная рамка
const entropyBox = document.getElementById('entropyBox'); // зелёный квадрат зоны
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');
const btnProtect = document.getElementById('btnProtect');
const btnVerify = document.getElementById('btnVerify');
const btnTorch = document.getElementById('btnTorch');
const btnShot = document.getElementById('btnShot');
const btnCancel = document.getElementById('btnCancel');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const modalInput = document.getElementById('modalInput');
const modalOk = document.getElementById('modalOk');

// ---------- Константы алгоритма ----------
const DB_NAME = 'art-inspector-db', STORE = 'paintings';
const TICK_MS = 350;             // период анализа кадра
const FRAME_W = 256;             // даунскейл для поиска границы картины
const TRACK_W = 160;             // даунскейл для трекинга зоны
const PAINT_FILL = 0.72;         // картина должна занять >= 72% кадра (п.3)
const FILL_HITS = 3;             // стабильных срабатываний подряд
const DETECT_TIMEOUT_MS = 20000; // п.2: не обнаружено -> возврат назад
const BLOCK = 28;                // блок поиска энтропии (в px кропа полотна)
const MIN_ENTROPY = 4.6;         // бит (гистограмма 64 бина)
const ZONE_FRAC = 0.24;          // сторона зелёного квадрата / меньшая сторона картины
const CENTER_MARGIN = 0.16;      // отступ от краёв полотна при поиске зоны (п.3: без рамки)
const ZONE_STABLE_HITS = 4;
const TRACK_SCALES = [0.9, 1.0, 1.15, 1.35]; // масштабы шаблона при трекинге (п.5)
const TRACK_MIN_SCORE = 0.40;
const ROI_PAD = 1.5;             // расширение области поиска трекинга
const LAP_MIN = 35;              // порог резкости (дисперсия лапласиана)
const READY_SIDE = 0.28;         // зона >= 28% ширины кадра — «можно снимать» (п.6)
const FEATURE_MATCH = 0.78;      // порог поиска картины в базе по фичам (п.13)
const HEIGHT_STD = 3.0;          // порог 3D-рельефа (п.8/18)
const CORR_MATCH = 0.80;         // порог совпадения эталонного фрагмента (п.19)
const SIMZ_MATCH = 0.55;         // порог совпадения карты высот (п.19)
const TMPL = 96;                 // размер шаблона зоны, px

// ---------- Состояние ----------
let stream = null, videoTrack = null, torchOn = false;
let mode = null;              // 'protect' | 'verify'
let state = 'idle';
let tickTimer = null, tickBusy = false, tickCount = 0;
let rafRunning = false;
let cvReady = false;

let detectStartedAt = 0;
let paintBox = null;          // граница картины в долях кадра {fx,fy,fw,fh,areaFrac} (EMA)
let paintHits = 0, paintMisses = 0;
let boundaryVisible = false;  // видна ли граница картины (п.3: рамка появляется/исчезает)
let paintFillsFrame = false;  // картина заполняет кадр, граница вне кадра — это норма при приближении
let fillHits = 0;

let zoneEMA = null;           // кандидат зоны в координатах полотна {cx,cy,s}
let zoneBase = null;          // зафиксированная зона в координатах полотна
let zoneStable = 0, zoneEntropy = 0;
let trackBox = null;          // зона в долях кадра (результат трекинга, EMA)
let trackMisses = 0, lastTrackScore = 0;
let dispBox = null;           // сглаженная рамка для отрисовки
let tmplData = null;          // Uint8ClampedArray TMPL*TMPL, серый шаблон зоны
let tmplMat = null;           // cv.Mat шаблона (лениво)

let globalFeatures = null;    // фичи полотна (п.3/12)
let verifyBase = null;        // запись из базы (verify)
let baseSim = null;
let shots = [];               // [{patch: ImageData96, full: ImageData<=720}]
let targetIndex = 0;

let dbPromise = null;

// ---------- Рабочие canvas ----------
const workCanvas = document.createElement('canvas');
const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });
const cropCanvas = document.createElement('canvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
const tmpCanvas = document.createElement('canvas');
const tmpCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });

function setCanvas(cv2, w, h) {
  if (cv2.width !== w || cv2.height !== h) { cv2.width = w; cv2.height = h; }
}

// ---------- Мелкие утилиты ----------
function setHint(t) { hint.textContent = t; }
function setStatus(t) { statusEl.textContent = t; }

function emaBox(a, b, k) {
  return {
    fx: a.fx * (1 - k) + b.fx * k,
    fy: a.fy * (1 - k) + b.fy * k,
    fw: a.fw * (1 - k) + b.fw * k,
    fh: a.fh * (1 - k) + b.fh * k,
    areaFrac: (b.areaFrac != null ? b.areaFrac : a.areaFrac),
    score: (b.score != null ? b.score : a.score)
  };
}
function lerpBox(a, b, k) {
  return {
    fx: a.fx + (b.fx - a.fx) * k, fy: a.fy + (b.fy - a.fy) * k,
    fw: a.fw + (b.fw - a.fw) * k, fh: a.fh + (b.fh - a.fh) * k
  };
}
function grayOf(d, i) { return 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; }

// доля пикселей-зеркальных бликов (пересвет + низкая насыщенность)
function specFracOf(d) {
  let c = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    n++;
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const mx = Math.max(r, g, b);
    if (mx > 246 && Math.abs(r - g) < 14 && Math.abs(g - b) < 14 && Math.abs(r - b) < 14) c++;
  }
  return n ? c / n : 1;
}

// контраст (std яркости) и резкость (дисперсия лапласиана) дляImageData 64x64
function patchStats64(imgData) {
  const S = imgData.width, d = imgData.data;
  const g = new Float32Array(S * S);
  let sum = 0;
  for (let i = 0, p = 0; i < g.length; i++, p += 4) { g[i] = grayOf(d, p); sum += g[i]; }
  const m = sum / g.length;
  let v = 0;
  for (let i = 0; i < g.length; i++) v += (g[i] - m) * (g[i] - m);
  const lumStd = Math.sqrt(v / g.length);
  let ls = 0, ls2 = 0, n = 0;
  for (let y = 1; y < S - 1; y++) for (let x = 1; x < S - 1; x++) {
    const lap = 4 * g[y * S + x] - g[y * S + x - 1] - g[y * S + x + 1] -
      g[(y - 1) * S + x] - g[(y + 1) * S + x];
    ls += lap; ls2 += lap * lap; n++;
  }
  const lm = ls / n;
  return { lumStd, lapVar: Math.max(0, ls2 / n - lm * lm) };
}

// ---------- Кадр: даунскейл + серая шкала ----------
function grabFrame(W) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const H = Math.max(1, Math.round(W * vh / vw));
  setCanvas(workCanvas, W, H);
  workCtx.drawImage(video, 0, 0, W, H);
  const rgba = workCtx.getImageData(0, 0, W, H).data;
  const gray = new Uint8ClampedArray(W * H);
  for (let i = 0, p = 0; i < gray.length; i++, p += 4) gray[i] = grayOf(rgba, p);
  return { W, H, gray, rgba };
}

// ==========================================================================
//  П.2/11 — обнаружение картины (жёлтая пунктирная рамка)
// ==========================================================================
function medianGray(gray) {
  const s = [];
  for (let i = 0; i < gray.length; i += 17) s.push(gray[i]);
  s.sort((a, b) => a - b);
  return s.length ? s[s.length >> 1] : 128;
}

function detectBounds() {
  if (!cvReady || !window.cv || !video.videoWidth) return null;
  const fr = grabFrame(FRAME_W);
  const cv = window.cv;
  let src = null, gray = null, blur = null, edges = null, kernel = null,
    contours = null, hierarchy = null;
  try {
    src = cv.imread(workCanvas);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    blur = new cv.Mat();
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
    // адаптивные пороги Canny по медиане яркости (устойчиво к освещению)
    const med = medianGray(fr.gray);
    const lo = Math.max(20, Math.min(110, Math.round(med * 0.6)));
    const hi = Math.max(60, Math.min(220, Math.round(med * 1.6)));
    edges = new cv.Mat();
    cv.Canny(blur, edges, lo, hi);
    kernel = cv.Mat.ones(3, 3, cv.CV_8U);
    cv.dilate(edges, edges, kernel);
    cv.dilate(edges, edges, kernel);
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
    const imgArea = fr.W * fr.H;
    let best = null, sawFill = false;
    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i);
      let approx = null;
      try {
        const area = cv.contourArea(cnt);
        if (area < imgArea * 0.05) continue;
        if (area > imgArea * 0.965) { sawFill = true; continue; } // граница ушла за кадр — картина на весь кадр
        const peri = cv.arcLength(cnt, true);
        approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.045 * peri, true);
        if (approx.rows !== 4) continue; // нужен четырёхугольник
        const pts = [];
        for (let j = 0; j < 4; j++) pts.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
        let quad = true;
        for (let j = 0; j < 4; j++) {
          const p1 = pts[j], p2 = pts[(j + 1) % 4], p3 = pts[(j + 2) % 4];
          const v1x = p2.x - p1.x, v1y = p2.y - p1.y;
          const v2x = p3.x - p2.x, v2y = p3.y - p2.y;
          const dot = v1x * v2x + v1y * v2y;
          const l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
          const ang = Math.abs(Math.acos(Math.max(-1, Math.min(1, dot / (l1 * l2 + 1e-9)))) * 180 / Math.PI);
          if (ang < 62 || ang > 118) { quad = false; break; }
        }
        const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        const bw = maxX - minX, bh = maxY - minY;
        if (bw < 12 || bh < 12) continue;
        if (Math.max(bw, bh) / Math.min(bw, bh) > 4.5) continue;
        const fill = area / (bw * bh);
        if (fill < 0.62) continue;
        const ccx = (minX + maxX) / 2 / fr.W, ccy = (minY + maxY) / 2 / fr.H;
        const centrality = 1 - Math.min(1, Math.hypot(ccx - 0.5, ccy - 0.5) / 0.7);
        const score = area * fill * (0.7 + 0.3 * centrality) * (quad ? 1.0 : 0.7);
        if (!best || score > best.score) {
          best = {
            fx: minX / fr.W, fy: minY / fr.H, fw: bw / fr.W, fh: bh / fr.H,
            areaFrac: area / imgArea, score
          };
        }
      } finally {
        if (approx) approx.delete();
        cnt.delete();
      }
    }
    if (!best && sawFill) return { fills: true }; // картина заполняет кадр
    return best;
  } catch (e) {
    console.warn('detectBounds:', e);
    return null;
  } finally {
    try {
      if (src) src.delete();
      if (gray) gray.delete();
      if (blur) blur.delete();
      if (edges) edges.delete();
      if (kernel) kernel.delete();
      if (contours) contours.delete();
      if (hierarchy) hierarchy.delete();
    } catch (e) {}
  }
}

// гистерезис: рамка показывается после 2 попаданий, скрывается после 3 промахов (п.3)
function updateBoundary() {
  const det = detectBounds();
  if (det && det.fills) {
    // картина заполняет кадр: границ не видно — при приближении это норма (п.3)
    paintHits = 0; paintMisses = 0;
    boundaryVisible = false;
    paintFillsFrame = true;
    detectStartedAt = Date.now();
    return det;
  }
  if (det) {
    paintHits++; paintMisses = 0;
    if (paintHits >= 2) {
      paintBox = paintBox ? emaBox(paintBox, det, 0.45) : Object.assign({}, det);
      boundaryVisible = true;
      paintFillsFrame = false;
      detectStartedAt = Date.now();
    }
  } else {
    paintMisses++; paintHits = 0;
    if (paintMisses >= 3) boundaryVisible = false;
  }
  return det;
}

// граница ушла за кадр при приближении: считаем, что картина = весь кадр
function assumeFillsFrame() {
  paintBox = { fx: 0, fy: 0, fw: 1, fh: 1, areaFrac: 1 };
  paintFillsFrame = true;
  boundaryVisible = false;
}

// ==========================================================================
//  П.3/12 — фичи полотна для поиска в базе и позиционирования
// ==========================================================================
function computeGlobalFeatures() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const W = 320, H = Math.max(1, Math.round(320 * vh / vw));
  setCanvas(cropCanvas, W, H);
  cropCtx.drawImage(video, 0, 0, W, H);
  // кроп по границе картины — фичи считаются только по полотну
  let sx = 0, sy = 0, sw = W, sh = H;
  if (paintBox) {
    sx = Math.max(0, Math.min(W - 8, Math.round(paintBox.fx * W)));
    sy = Math.max(0, Math.min(H - 8, Math.round(paintBox.fy * H)));
    sw = Math.max(8, Math.min(W - sx, Math.round(paintBox.fw * W)));
    sh = Math.max(8, Math.min(H - sy, Math.round(paintBox.fh * H)));
  }
  const S = 128;
  setCanvas(tmpCanvas, S, S);
  tmpCtx.drawImage(cropCanvas, sx, sy, sw, sh, 0, 0, S, S);
  const d = tmpCtx.getImageData(0, 0, S, S).data;
  const G = 8, cw = S / G;
  const out = new Float32Array(G * G * 4 + 72);
  // 8x8: средние R,G,B + контраст в ячейке
  for (let gy = 0; gy < G; gy++) for (let gx = 0; gx < G; gx++) {
    let r = 0, g = 0, b = 0, lsum = 0, l2 = 0, n = 0;
    for (let y = gy * cw; y < (gy + 1) * cw; y++)
      for (let x = gx * cw; x < (gx + 1) * cw; x++) {
        const i = (y * S + x) * 4;
        r += d[i]; g += d[i + 1]; b += d[i + 2];
        const l = grayOf(d, i);
        lsum += l; l2 += l * l; n++;
      }
    const o = (gy * G + gx) * 4;
    out[o] = r / n / 255;
    out[o + 1] = g / n / 255;
    out[o + 2] = b / n / 255;
    const m = lsum / n;
    out[o + 3] = Math.sqrt(Math.max(0, l2 / n - m * m)) / 128;
  }
  // гистограммы R,G,B по 24 бина
  const hR = new Float32Array(24), hG = new Float32Array(24), hB = new Float32Array(24);
  for (let i = 0; i < d.length; i += 4) {
    hR[Math.min(23, (d[i] * 24 / 256) | 0)]++;
    hG[Math.min(23, (d[i + 1] * 24 / 256) | 0)]++;
    hB[Math.min(23, (d[i + 2] * 24 / 256) | 0)]++;
  }
  const tot = S * S;
  for (let i = 0; i < 24; i++) {
    out[256 + i] = hR[i] / tot;
    out[256 + 24 + i] = hG[i] / tot;
    out[256 + 48 + i] = hB[i] / tot;
  }
  return normalizeL2(out);
}

// фичи зелёной зоны (дескриптор для базы, п.3/10)
function zoneDescriptor(img256) {
  const d = img256.data, S = img256.width, G = 4, B = 16, cw = S / G;
  const out = new Float32Array(G * G * B + 5);
  for (let gy = 0; gy < G; gy++) for (let gx = 0; gx < G; gx++) {
    const hist = new Float32Array(B);
    let n = 0;
    for (let y = gy * cw; y < (gy + 1) * cw; y++)
      for (let x = gx * cw; x < (gx + 1) * cw; x++) {
        const l = Math.min(255, grayOf(d, (y * S + x) * 4) | 0);
        hist[Math.min(B - 1, (l * B / 256) | 0)]++;
        n++;
      }
    for (let k = 0; k < B; k++) out[(gy * G + gx) * B + k] = hist[k] / n;
  }
  let sum = 0, sum2 = 0, r = 0, g = 0, b = 0, n2 = 0;
  for (let i = 0; i < d.length; i += 4) {
    const l = grayOf(d, i);
    sum += l; sum2 += l * l; r += d[i]; g += d[i + 1]; b += d[i + 2]; n2++;
  }
  const m = sum / n2, o = G * G * B;
  out[o] = m / 255;
  out[o + 1] = Math.sqrt(Math.max(0, sum2 / n2 - m * m)) / 128;
  out[o + 2] = r / n2 / 255; out[o + 3] = g / n2 / 255; out[o + 4] = b / n2 / 255;
  return normalizeL2(out);
}

// ==========================================================================
//  П.3/4 — поиск области максимальной энтропии ближе к центру полотна
// ==========================================================================
function searchZone() {
  if (!paintBox || !video.videoWidth) return null;
  const fr = grabFrame(FRAME_W);
  const sx = Math.max(0, Math.round(paintBox.fx * fr.W));
  const sy = Math.max(0, Math.round(paintBox.fy * fr.H));
  const sw = Math.min(fr.W - sx, Math.max(8, Math.round(paintBox.fw * fr.W)));
  const sh = Math.min(fr.H - sy, Math.max(8, Math.round(paintBox.fh * fr.H)));
  const PW = 224, PH = Math.max(24, Math.round(PW * sh / sw));
  setCanvas(cropCanvas, PW, PH);
  cropCtx.drawImage(workCanvas, sx, sy, sw, sh, 0, 0, PW, PH);
  const d = cropCtx.getImageData(0, 0, PW, PH).data;
  const cols = Math.floor(PW / BLOCK), rows = Math.floor(PH / BLOCK);
  const margin = (cols < 4 || rows < 4) ? 0.05 : CENTER_MARGIN;
  let best = null;
  for (let by = 0; by < rows; by++) for (let bx = 0; bx < cols; bx++) {
    const cx = (bx + 0.5) * BLOCK / PW, cy = (by + 0.5) * BLOCK / PH;
    if (cx < margin || cx > 1 - margin || cy < margin || cy > 1 - margin) continue;
    const hist = new Float64Array(64);
    let n = 0;
    for (let y = by * BLOCK; y < (by + 1) * BLOCK; y++)
      for (let x = bx * BLOCK; x < (bx + 1) * BLOCK; x++) {
        const l = grayOf(d, (y * PW + x) * 4) | 0;
        hist[Math.min(63, l >> 2)]++; n++;
      }
    let H = 0;
    for (let k = 0; k < 64; k++) if (hist[k]) { const p = hist[k] / n; H -= p * Math.log2(p); }
    const dist = Math.hypot(cx - 0.5, cy - 0.5) / 0.7071;
    const w = 0.75 + 0.25 * Math.exp(-(dist * dist) / (2 * 0.4 * 0.4)); // мягкий приоритет центра
    const score = H * w;
    if (!best || score > best.score) best = { cx, cy, H, score };
  }
  if (!best) return null;
  return { cx: best.cx, cy: best.cy, s: ZONE_FRAC, H: best.H };
}

// зона (квадрат на поверхности картины) <-> рамка в долях видеокадра
function zoneToFrameFrac(zc) {
  const pb = paintBox || { fx: 0, fy: 0, fw: 1, fh: 1 };
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const paintW = pb.fw * vw, paintH = pb.fh * vh;
  const m = Math.min(paintW, paintH);
  const side = zc.s * m;
  const cxPx = pb.fx * vw + zc.cx * paintW;
  const cyPx = pb.fy * vh + zc.cy * paintH;
  return {
    fx: (cxPx - side / 2) / vw, fy: (cyPx - side / 2) / vh,
    fw: side / vw, fh: side / vh
  };
}
function frameToZoneBase(tb) {
  if (!paintBox || !zoneBase) return zoneBase;
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const paintW = paintBox.fw * vw, paintH = paintBox.fh * vh;
  const m = Math.min(paintW, paintH);
  if (m < 4) return zoneBase;
  const cxPx = (tb.fx + tb.fw / 2) * vw, cyPx = (tb.fy + tb.fh / 2) * vh;
  const side = Math.min(tb.fw * vw, tb.fh * vh);
  return {
    cx: Math.max(0, Math.min(1, (cxPx - paintBox.fx * vw) / paintW)),
    cy: Math.max(0, Math.min(1, (cyPx - paintBox.fy * vh) / paintH)),
    s: side / m
  };
}

// ==========================================================================
//  П.5/15 — трекинг зелёной зоны: шаблон + многомерный matchTemplate
// ==========================================================================
function captureTemplate(tb) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const x = Math.max(0, Math.min(vw - 8, Math.round(tb.fx * vw)));
  const y = Math.max(0, Math.min(vh - 8, Math.round(tb.fy * vh)));
  const w = Math.min(vw - x, Math.max(8, Math.round(tb.fw * vw)));
  const h = Math.min(vh - y, Math.max(8, Math.round(tb.fh * vh)));
  setCanvas(tmpCanvas, TMPL, TMPL);
  tmpCtx.drawImage(video, x, y, w, h, 0, 0, TMPL, TMPL);
  const d = tmpCtx.getImageData(0, 0, TMPL, TMPL).data;
  tmplData = new Uint8ClampedArray(TMPL * TMPL);
  for (let i = 0, p = 0; i < tmplData.length; i++, p += 4) tmplData[i] = grayOf(d, p);
  if (tmplMat) { try { tmplMat.delete(); } catch (e) {} tmplMat = null; }
}
function tmplToMat(cv) {
  if (!tmplMat && tmplData) {
    tmplMat = new cv.Mat(TMPL, TMPL, cv.CV_8U);
    tmplMat.data.set(tmplData);
  }
  return tmplMat;
}

function trackZoneStep() {
  if (!cvReady || !window.cv || !tmplData || !video.videoWidth) return false;
  const cv = window.cv;
  const fr = grabFrame(TRACK_W);
  let pred = trackBox;
  if (!pred && zoneBase) pred = zoneToFrameFrac(zoneBase);
  if (!pred) return false;
  const cx = (pred.fx + pred.fw / 2) * fr.W, cy = (pred.fy + pred.fh / 2) * fr.H;
  const side = Math.max(pred.fw * fr.W, pred.fh * fr.H);
  const roiHalf = Math.max(side * ROI_PAD, 24);
  let rx = Math.max(0, Math.round(cx - roiHalf));
  let ry = Math.max(0, Math.round(cy - roiHalf));
  let rw = Math.min(Math.round(roiHalf * 2), fr.W - rx);
  let rh = Math.min(Math.round(roiHalf * 2), fr.H - ry);
  if (rw < 24 || rh < 24) return false;
  let src = null, gray = null, gblur = null, roi = null, res = null, tS = null, tB = null;
  try {
    src = cv.imread(workCanvas);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    gblur = new cv.Mat();
    cv.GaussianBlur(gray, gblur, new cv.Size(3, 3), 0);
    roi = new cv.Mat(gblur, new cv.Rect(rx, ry, rw, rh));
    const tBase = tmplToMat(cv);
    if (!tBase) return false;
    let best = null;
    for (const sc of TRACK_SCALES) {
      const t = Math.round(side * sc);
      if (t < 14 || t >= rw - 2 || t >= rh - 2) continue;
      tS = new cv.Mat();
      cv.resize(tBase, tS, new cv.Size(t, t), 0, 0, cv.INTER_LINEAR);
      tB = new cv.Mat();
      cv.GaussianBlur(tS, tB, new cv.Size(3, 3), 0);
      res = new cv.Mat();
      cv.matchTemplate(roi, tB, res, cv.TM_CCOEFF_NORMED);
      const mm = cv.minMaxLoc(res);
      tB.delete(); tB = null;
      tS.delete(); tS = null;
      res.delete(); res = null;
      if (isFinite(mm.maxVal) && (!best || mm.maxVal > best.score)) {
        best = { score: mm.maxVal, x: mm.maxLoc.x, y: mm.maxLoc.y, t };
      }
    }
    if (best && best.score >= TRACK_MIN_SCORE) {
      const nb = {
        fx: (rx + best.x) / fr.W, fy: (ry + best.y) / fr.H,
        fw: best.t / fr.W, fh: best.t / fr.H
      };
      trackBox = trackBox ? emaBox(trackBox, nb, 0.5) : nb;
      lastTrackScore = best.score;
      trackMisses = 0;
      return true;
    }
    lastTrackScore = best ? best.score : 0;
    trackMisses++;
    return false;
  } catch (e) {
    console.warn('trackZoneStep:', e);
    trackMisses++;
    return false;
  } finally {
    try {
      if (res) res.delete();
      if (tB) tB.delete();
      if (tS) tS.delete();
      if (roi) roi.delete();
      if (gblur) gblur.delete();
      if (gray) gray.delete();
      if (src) src.delete();
    } catch (e) {}
  }
}

// резкость зоны (п.6: «с сохранением резкости»)
function zoneSharp() {
  if (!trackBox || !video.videoWidth) return null;
  const vw = video.videoWidth, vh = video.videoHeight;
  const x = Math.max(0, Math.min(vw - 8, Math.round(trackBox.fx * vw)));
  const y = Math.max(0, Math.min(vh - 8, Math.round(trackBox.fy * vh)));
  const w = Math.min(vw - x, Math.max(8, Math.round(trackBox.fw * vw)));
  const h = Math.min(vh - y, Math.max(8, Math.round(trackBox.fh * vh)));
  setCanvas(tmpCanvas, 64, 64);
  tmpCtx.drawImage(video, x, y, w, h, 0, 0, 64, 64);
  const img = tmpCtx.getImageData(0, 0, 64, 64);
  const st = patchStats64(img);
  return { lapVar: st.lapVar, sideFrac: trackBox.fw };
}

// ==========================================================================
//  Отрисовка рамок
// ==========================================================================
function renderBoxes() {
  const g = computeGeometry();
  if (!g) return;
  // жёлтая пунктирная — только когда граница картины реально видна в кадре (п.3)
  if (boundaryVisible && paintBox && state !== 'idle') {
    objectBox.style.display = 'block';
    objectBox.style.left = (g.offX + paintBox.fx * g.drawW) + 'px';
    objectBox.style.top = (g.offY + paintBox.fy * g.drawH) + 'px';
    objectBox.style.width = (paintBox.fw * g.drawW) + 'px';
    objectBox.style.height = (paintBox.fh * g.drawH) + 'px';
  } else {
    objectBox.style.display = 'none';
  }
  // зелёный квадрат зоны (п.4/5) — по трекингу, плавно
  const showZone = (state === 'locked' || state === 'shoot' || state === 'process') && trackBox;
  if (showZone) {
    dispBox = dispBox ? lerpBox(dispBox, trackBox, 0.28) : Object.assign({}, trackBox);
    entropyBox.style.display = 'block';
    entropyBox.style.left = (g.offX + dispBox.fx * g.drawW) + 'px';
    entropyBox.style.top = (g.offY + dispBox.fy * g.drawH) + 'px';
    entropyBox.style.width = (dispBox.fw * g.drawW) + 'px';
    entropyBox.style.height = (dispBox.fh * g.drawH) + 'px';
  } else {
    entropyBox.style.display = 'none';
    dispBox = null;
  }
}
function startRenderLoop() {
  if (rafRunning) return;
  rafRunning = true;
  const loop = () => { renderBoxes(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

// ==========================================================================
//  Машина состояний (тик анализа)
// ==========================================================================
function startTicks() { stopTicks(); tickTimer = setInterval(onTick, TICK_MS); }
function stopTicks() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

async function onTick() {
  if (tickBusy || state === 'idle') return;
  if (!video.videoWidth || video.readyState < 2) return;
  tickBusy = true; tickCount++;
  try {
    if (state === 'detect') tickDetect();
    else if (state === 'zone_search') tickZoneSearch();
    else if (state === 'locked') tickLocked();
    else if (state === 'shoot') tickShoot();
  } catch (e) {
    console.warn('tick:', e);
  } finally {
    tickBusy = false;
  }
}
function tickDetect() {
  const det = updateBoundary();
  if (det && det.fills) {
    // уже близко: картина занимает весь кадр
    fillHits++;
    setHint('Картина на весь кадр. Держите камеру неподвижно…');
    setStatus('Картина заполняет кадр');
    if (fillHits >= FILL_HITS) { assumeFillsFrame(); onPaintingFilled(); }
    return;
  }
  if (boundaryVisible && paintBox) {
    setHint('Картина обнаружена. Приближайтесь, пока она не займёт весь кадр.');
    setStatus(`Граница: ${Math.round(paintBox.areaFrac * 100)}% кадра · нужно ≥ ${Math.round(PAINT_FILL * 100)}%`);
    if (paintBox.areaFrac >= PAINT_FILL) {
      fillHits++;
      if (fillHits >= FILL_HITS) onPaintingFilled();
    } else fillHits = 0;
    return;
  }
  // граница не видна
  if (paintBox && paintBox.areaFrac >= PAINT_FILL && paintMisses >= 3) {
    // рамка ушла за границы кадра при приближении — продолжаем работу (п.3)
    assumeFillsFrame();
    onPaintingFilled();
    return;
  }
  fillHits = 0;
  setHint('Наведите камеру на картину — ищем прямоугольный объект…');
  const left = Math.max(0, Math.ceil((DETECT_TIMEOUT_MS - (Date.now() - detectStartedAt)) / 1000));
  setStatus(`Картина не обнаружена… осталось ${left} с до возврата`);
  if (Date.now() - detectStartedAt > DETECT_TIMEOUT_MS) {
    stopTicks(); // п.2: объект не обнаружен — возврат назад
    showModal('Картина не обнаружена',
      'Прямоугольная картина не найдена в кадре. Возврат в главное меню.')
      .then(() => goHome());
  }
}

function onPaintingFilled() {
  fillHits = 0;
  globalFeatures = computeGlobalFeatures(); // п.3/12: фичи полотна
  if (mode === 'protect') {
    state = 'zone_search';
    zoneEMA = null; zoneStable = 0;
    syncShotBtn();
    setHint('Ищем самую информативную (текстурную) зону ближе к центру полотна…');
    setStatus('');
  } else {
    state = 'lookup';
    syncShotBtn();
    handleVerifyLookup().catch(async e => {
      console.error('lookup error:', e);
      await showModal('Ошибка', 'Сбой поиска в базе: ' + e.message);
      goHome();
    });
  }
}
function tickZoneSearch() {
  if (tickCount % 2 === 0) updateBoundary();
  if (!boundaryVisible) {
    if (paintFillsFrame) {
      // норма: картина на весь кадр, граница вне кадра (п.3) — продолжаем поиск зоны
    } else if (paintBox && paintBox.areaFrac >= PAINT_FILL && paintMisses >= 3) {
      assumeFillsFrame(); // приблизились — граница ушла за кадр
    } else if (paintMisses > 6) {
      // действительно отвели камеру — назад к поиску границы
      state = 'detect';
      fillHits = 0; zoneEMA = null; zoneStable = 0;
      syncShotBtn();
      setHint('Картина потеряна — наведите камеру заново…');
      return;
    }
  }
  const z = searchZone();
  if (z && z.H >= MIN_ENTROPY) {
    zoneEMA = zoneEMA
      ? { cx: zoneEMA.cx * 0.75 + z.cx * 0.25, cy: zoneEMA.cy * 0.75 + z.cy * 0.25, s: z.s }
      : z;
    zoneStable++;
    zoneEntropy = z.H;
    setStatus(`Энтропия зоны: ${z.H.toFixed(2)} бит · стабильность ${zoneStable}/${ZONE_STABLE_HITS}`);
    if (zoneStable >= ZONE_STABLE_HITS) lockZone();
  } else {
    zoneStable = 0;
    setHint(paintFillsFrame
      ? 'Картина на весь кадр — ищу текстурную зону ближе к центру…'
      : 'Ищем текстурную зону ближе к центру картины…');
    setStatus(z ? `Лучшая энтропия ${z.H.toFixed(2)} бит — нужно ≥ ${MIN_ENTROPY}` : 'Кандидат не найден');
  }
}

// п.4: зона найдена -> зелёный квадрат, просим приблизиться
function lockZone() {
  zoneBase = { cx: zoneEMA.cx, cy: zoneEMA.cy, s: zoneEMA.s };
  trackBox = zoneToFrameFrac(zoneBase);
  captureTemplate(trackBox); // шаблон для трекинга (п.5)
  state = 'locked';
  trackMisses = 0; lastTrackScore = 0;
  syncShotBtn();
  setHint('Зона найдена! Приблизьтесь к зелёному квадрату, держите резкость — затем нажмите «Фото».');
}

function tickLocked() {
  if (tickCount % 3 === 0) updateBoundary(); // рамка появляется/исчезает по границе (п.3)
  const ok = trackZoneStep();                // п.5: квадрат фиксирован на зоне
  if (!ok && boundaryVisible && paintBox && zoneBase) {
    trackBox = zoneToFrameFrac(zoneBase);    // фолбэк по координатам полотна
  }
  if (ok && boundaryVisible && paintBox && tickCount % 6 === 0) {
    zoneBase = frameToZoneBase(trackBox);    // ресинхронизация координат полотна
  }
  const sh = zoneSharp();
  const ready = sh && sh.lapVar >= LAP_MIN && sh.sideFrac >= READY_SIDE;
  if (trackMisses > 5 && !boundaryVisible) {
    setHint(trackBox && trackBox.fw > 0.85
      ? 'Слишком близко — зона больше кадра. Немного отведите камеру назад.'
      : 'Зона потеряна. Медленно отведите камеру назад, чтобы снова увидеть картину.');
  } else if (ready) {
    setHint(mode === 'protect'
      ? 'Резкость в норме — нажмите «Фото»: потребуется 5 снимков с небольшими сдвигами.'
      : `«${verifyBase.name}». Резкость в норме — нажмите «Фото»: потребуется 5 снимков.`);
  } else {
    setHint(sh && sh.lapVar < LAP_MIN
      ? 'Держите камеру неподвижно / приблизьтесь — нужна резкость.'
      : 'Приблизьтесь к зелёной зоне…');
  }
  const parts = [];
  if (mode === 'verify' && baseSim != null) parts.push(`сходство ${(baseSim * 100).toFixed(0)}%`);
  if (zoneEntropy) parts.push(`энтропия ${zoneEntropy.toFixed(2)}`);
  parts.push(`трекинг ${Math.round(lastTrackScore * 100)}%`);
  if (sh) parts.push(`резкость ${sh.lapVar.toFixed(0)}${ready ? ' ✓' : ''}`);
  setStatus(parts.join(' · '));
}

function tickShoot() {
  // во время серии снимков трекинг продолжается — квадрат остаётся на зоне (п.6)
  if (tickCount % 2 === 0) {
    const ok = trackZoneStep();
    if (!ok && boundaryVisible && paintBox && zoneBase) trackBox = zoneToFrameFrac(zoneBase);
  }
}

// ==========================================================================
//  П.11-15 — поиск картины в базе (режим «Проверка»)
// ==========================================================================
async function handleVerifyLookup() {
  setHint('Ищем картину в базе…');
  setStatus('');
  let list = [];
  try { list = await dbAll(); } catch (e) { list = []; }
  if (!list.length) {
    await showModal('Не найдено', 'В базе нет защищённых картин. Сначала выполните защиту.');
    goHome();
    return;
  }
  // п.13: поиск по фичам полотна
  let best = null, bestSim = -1;
  for (const rec of list) {
    const sim = cosine(globalFeatures, rec.globalFeatures);
    if (sim > bestSim) { bestSim = sim; best = rec; }
  }
  let rec = null;
  if (bestSim >= FEATURE_MATCH) {
    rec = best;
  } else {
    // не найдено по изображению — спрашиваем название
    const name = await showModal('Уточните название',
      `Автоматически картина не распознана (лучшее сходство ${(bestSim * 100).toFixed(0)}%). Введите название картины:`,
      { input: true, okText: 'Найти' });
    if (name) {
      const nl = name.toLowerCase();
      rec = list.find(r => r.name && r.name.toLowerCase().includes(nl)) || null;
    }
    if (!rec) {
      await showModal('Не найдено',
        'Картина не найдена ни по изображению, ни по названию. Возврат в главное меню.');
      goHome();
      return;
    }
  }
  const zc = rec.zoneCoords;
  if (!zc || typeof zc.cx !== 'number' || !rec.reference || !rec.heightMap) {
    await showModal('Ошибка', 'Запись старого формата или повреждена. Выполните защиту заново.');
    goHome();
    return;
  }
  verifyBase = rec;
  baseSim = bestSim;
  zoneBase = { cx: zc.cx, cy: zc.cy, s: zc.s };
  tmplData = (rec.zoneTemplate && rec.zoneTemplate.length === TMPL * TMPL)
    ? new Uint8ClampedArray(rec.zoneTemplate) : null;
  if (tmplMat) { try { tmplMat.delete(); } catch (e) {} tmplMat = null; }
  trackBox = zoneToFrameFrac(zoneBase); // п.13-14: зелёная зона по координатам из базы
  state = 'locked';
  trackMisses = 0;
  syncShotBtn();
  setHint(`Найдено: «${rec.name}». Приблизьтесь к зелёной зоне и нажмите «Фото».`);
  setStatus(`Сходство: ${(bestSim * 100).toFixed(1)}%`);
}

const SHOT_GUIDE = [
  'Снимок 1/5 готов. Сдвиньте камеру слегка ВЛЕВО (~10 см) и нажмите «Фото».',
  'Снимок 2/5 готов. Сдвиньте камеру слегка ВПРАВО и нажмите «Фото».',
  'Снимок 3/5 готов. Сдвиньте камеру слегка ВВЕРХ и нажмите «Фото».',
  'Снимок 4/5 готов. Сдвиньте камеру слегка ВНИЗ и нажмите «Фото».',
  'Все 5 снимков сделаны. Обрабатываем…'
];

async function onShot() {
  if (state === 'locked') {
    if (!trackBox) { setHint('Зона ещё не найдена — подождите или нажмите «Отмена».'); return; }
    state = 'shoot';
    targetIndex = 0;
    shots = [];
    captureShot();
    targetIndex = 1;
    setStatus('Снимок 1 из 5');
    setHint(SHOT_GUIDE[0]);
    return;
  }
  if (state === 'shoot') {
    captureShot();
    targetIndex++;
    setStatus(`Снимок ${targetIndex} из 5`);
    if (targetIndex < 5) { setHint(SHOT_GUIDE[targetIndex]); return; }
    btnShot.disabled = true;
    state = 'process';
    setHint('Обработка…');
    setStatus('Считаем карту высот…');
    await setTorch(false);
    setTimeout(() => {
      processAll().catch(async e => {
        console.error('processAll:', e);
        await showModal('Ошибка', 'Ошибка обработки: ' + e.message);
        goHome();
      });
    }, 150);
  }
}

function captureShot() {
  if (!trackBox || !video.videoWidth) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const x = Math.max(0, Math.min(vw - 8, Math.round(trackBox.fx * vw)));
  const y = Math.max(0, Math.min(vh - 8, Math.round(trackBox.fy * vh)));
  const w = Math.min(vw - x, Math.max(8, Math.round(trackBox.fw * vw)));
  const h = Math.min(vh - y, Math.max(8, Math.round(trackBox.fh * vh)));
  // патч 96×96 — для карты высот (п.7)
  const pc = document.createElement('canvas');
  pc.width = 96; pc.height = 96;
  const pctx = pc.getContext('2d', { willReadFrequently: true });
  pctx.drawImage(video, x, y, w, h, 0, 0, 96, 96);
  const patch = pctx.getImageData(0, 0, 96, 96);
  // полноразмерный кроп зоны (≤720 px) — для эталона (п.8/18)
  const sc = Math.min(1, 720 / Math.max(w, h));
  const fc = document.createElement('canvas');
  fc.width = Math.max(8, Math.round(w * sc));
  fc.height = Math.max(8, Math.round(h * sc));
  const fctx = fc.getContext('2d', { willReadFrequently: true });
  fctx.drawImage(video, x, y, w, h, 0, 0, fc.width, fc.height);
  const full = fctx.getImageData(0, 0, fc.width, fc.height);
  shots.push({ patch, full });
}

async function processAll() {
  const hm = buildHeightMap(shots.map(s => s && s.patch)); // п.7/17: оценка 3D-поверхности
  const heightMap = hm.map, stdZ = hm.std;
  setStatus(`Карта высот: std(Z)=${stdZ.toFixed(2)}, покрытие ${(hm.validFrac * 100).toFixed(0)}%`);
  if (mode === 'protect') await finishProtect(heightMap, stdZ, hm.validFrac);
  else await finishVerify(heightMap, stdZ, hm.validFrac);
}

// п.8: выбор эталона 256×256 из 5 снимков — без бликов, с контрастом и ВЧ
function selectBestReference(crops) {
  const c64 = document.createElement('canvas');
  c64.width = 64; c64.height = 64;
  const x64 = c64.getContext('2d', { willReadFrequently: true });
  let best = null;
  for (const crop of crops) {
    if (!crop) continue;
    const w = crop.width, h = crop.height;
    setCanvas(tmpCanvas, w, h);
    tmpCtx.putImageData(crop, 0, 0);
    const minSide = Math.min(w, h);
    const sides = minSide >= 512 ? [256, 384] : [Math.min(256, minSide)];
    for (const s of sides) {
      if (s > minSide) continue;
      const ox = (w - s) / 2, oy = (h - s) / 2;
      const cands = [[ox, oy]];
      if (w - s > 48) { cands.push([ox - (w - s) / 3, oy], [ox + (w - s) / 3, oy]); }
      if (h - s > 48) { cands.push([ox, oy - (h - s) / 3], [ox, oy + (h - s) / 3]); }
      for (const c of cands) {
        const x0 = Math.round(Math.max(0, Math.min(w - s, c[0])));
        const y0 = Math.round(Math.max(0, Math.min(h - s, c[1])));
        x64.drawImage(tmpCanvas, x0, y0, s, s, 0, 0, 64, 64);
        const d64 = x64.getImageData(0, 0, 64, 64);
        const st = patchStats64(d64);
        const spec = specFracOf(d64.data);
        const specPen = spec < 0.02 ? 1 : (spec < 0.06 ? 0.5 : 0.18);
        const score = (st.lapVar + 4) * (0.4 + st.lumStd / 90) * specPen;
        if (!best || score > best.score) {
          best = { crop, x0, y0, s, score, spec, lapVar: st.lapVar, lumStd: st.lumStd };
        }
      }
    }
  }
  if (!best) return null;
  const out = document.createElement('canvas');
  out.width = 256; out.height = 256;
  const octx = out.getContext('2d', { willReadFrequently: true });
  setCanvas(tmpCanvas, best.crop.width, best.crop.height);
  tmpCtx.putImageData(best.crop, 0, 0);
  octx.drawImage(tmpCanvas, best.x0, best.y0, best.s, best.s, 0, 0, 256, 256);
  const img = octx.getImageData(0, 0, 256, 256);
  return {
    data: img.data, w: 256, h: 256,
    zx: best.x0 / best.crop.width, zy: best.y0 / best.crop.height,
    zside: best.s / best.crop.width,
    spec: best.spec, lapVar: best.lapVar, lumStd: best.lumStd
  };
}

// п.8-10: защита — проверка 3D, выбор эталона, название, запись в базу
async function finishProtect(heightMap, stdZ, validFrac) {
  if (validFrac < 0.5) {
    await showModal('Снимки не совмещаются',
      `Общая область всего ${(validFrac * 100).toFixed(0)}% — сдвиги камеры были слишком большими. Повторите серию, сдвигая камеру на 1-2 см.`);
    goHome();
    return;
  }
  if (stdZ < HEIGHT_STD) {
    await showModal('Защита невозможна',
      `Поверхность плоская: перепад рельефа std(Z)=${stdZ.toFixed(2)} < ${HEIGHT_STD.toFixed(1)}. Похоже на полиграфию.`);
    goHome();
    return;
  }
  setStatus('Выбираем эталонный фрагмент 256×256…');
  const ref = selectBestReference(shots.map(s => s && s.full));
  if (!ref) {
    await showModal('Ошибка', 'Не удалось выбрать эталонный фрагмент.');
    goHome();
    return;
  }
  const glare = ref.spec > 0.03
    ? `\nВнимание: на фрагменте есть блики (${(ref.spec * 100).toFixed(0)}%) — при возможности переснимите.`
    : '';
  // п.9: название
  const name = await showModal('Поверхность 3D — защита возможна',
    `Рельеф: std(Z)=${stdZ.toFixed(2)}. Фрагмент: резкость ${ref.lapVar.toFixed(0)}, контраст ${ref.lumStd.toFixed(0)}, блики ${(ref.spec * 100).toFixed(0)}%.${glare}\nВведите название картины:`,
    { input: true, okText: 'Сохранить' });
  if (!name) {
    await showModal('Отмена', 'Название не введено — запись не сохранена.');
    goHome();
    return;
  }
  // п.10: полная запись в базу
  const record = {
    schema: 2,
    name,
    createdAt: Date.now(),
    globalFeatures: Array.from(globalFeatures || []),
    zoneCoords: { cx: zoneBase.cx, cy: zoneBase.cy, s: zoneBase.s },
    zoneTemplate: tmplData ? Array.from(tmplData) : null,
    zoneFeatures: Array.from(zoneDescriptor({ data: ref.data, width: ref.w })),
    reference: { data: Array.from(ref.data), w: ref.w, h: ref.h, zx: ref.zx, zy: ref.zy, zside: ref.zside },
    heightMap: Array.from(heightMap),
    stdZ,
    validFrac
  };
  try {
    await dbAdd(record);
    await showModal('Готово',
      `Картина «${name}» успешно защищена.\nДата: ${new Date(record.createdAt).toLocaleString()}`);
  } catch (e) {
    await showModal('Ошибка', 'Не удалось сохранить в базе: ' + e.message);
  }
  goHome();
}

function normalizeCropTo256(crop) {
  setCanvas(tmpCanvas, crop.width, crop.height);
  tmpCtx.putImageData(crop, 0, 0);
  const out = document.createElement('canvas');
  out.width = 256; out.height = 256;
  const octx = out.getContext('2d', { willReadFrequently: true });
  octx.drawImage(tmpCanvas, 0, 0, crop.width, crop.height, 0, 0, 256, 256);
  return octx.getImageData(0, 0, 256, 256);
}

// то же под-окно эталона (zx,zy,zside) внутри тестового кадра зоны
function refSubWindow(img256, zx, zy, zside) {
  if (zside == null || zside >= 0.99) return img256;
  const s = Math.max(32, Math.round(256 * zside));
  const x0 = Math.max(0, Math.min(256 - s, Math.round((zx || 0) * 256)));
  const y0 = Math.max(0, Math.min(256 - s, Math.round((zy || 0) * 256)));
  setCanvas(tmpCanvas, 256, 256);
  tmpCtx.putImageData(img256, 0, 0);
  const out = document.createElement('canvas');
  out.width = 256; out.height = 256;
  const octx = out.getContext('2d', { willReadFrequently: true });
  octx.drawImage(tmpCanvas, x0, y0, s, s, 0, 0, 256, 256);
  return octx.getImageData(0, 0, 256, 256);
}

// п.17-19: проверка — 3D-поверхность, лучший снимок, сравнение с эталоном
async function finishVerify(heightMap, stdZ, validFrac) {
  if (!verifyBase || !verifyBase.reference) {
    await showModal('Ошибка', 'Нет эталона для сравнения.');
    goHome();
    return;
  }
  if (validFrac < 0.5) {
    await showModal('Снимки не совмещаются',
      `Общая область всего ${(validFrac * 100).toFixed(0)}% — сдвиги камеры были слишком большими. Повторите серию, сдвигая камеру на 1-2 см.`);
    goHome();
    return;
  }
  if (stdZ < HEIGHT_STD) {
    await showModal('КОПИЯ',
      `Поверхность плоская: std(Z)=${stdZ.toFixed(2)} < ${HEIGHT_STD.toFixed(1)} — признаки полиграфии.`);
    goHome();
    return;
  }
  setStatus('Сравниваем с эталоном…');
  const refStored = {
    data: new Uint8ClampedArray(verifyBase.reference.data),
    width: verifyBase.reference.w || 256,
    height: verifyBase.reference.h || 256
  };
  const zx = verifyBase.reference.zx, zy = verifyBase.reference.zy, zside = verifyBase.reference.zside;
  // п.18: из 5 снимков выбираем наилучший для отображения эталонной зоны
  const results = [];
  for (const s of shots) {
    if (!s || !s.full) continue;
    const norm = normalizeCropTo256(s.full);
    const cands = [refSubWindow(norm, zx, zy, zside)];
    if (zside != null && zside < 0.99) cands.push(norm);
    for (const c of cands) {
      const aligned = alignFragmentAffine(c, refStored); // коррекция сдвига/масштаба
      results.push({ aligned, spec: specFracOf(c.data) });
    }
  }
  if (!results.length) {
    await showModal('Ошибка', 'Нет снимков для сравнения.');
    goHome();
    return;
  }
  results.sort((a, b) => b.aligned.corr - a.aligned.corr);
  let chosen = results[0];
  // пере-ранжирование с учётом бликов: если лучший в бликах — берём чистый аналог
  if (chosen.spec > 0.06) {
    const alt = results.find(r => r.spec < 0.03 && r.aligned.corr >= chosen.aligned.corr - 0.03);
    if (alt) chosen = alt;
  }
  const cmask = chosen.aligned.mask;
  const corrR = channelCorrelation(chosen.aligned.data, refStored.data, 0, cmask);
  const corrG = channelCorrelation(chosen.aligned.data, refStored.data, 1, cmask);
  const corrB = channelCorrelation(chosen.aligned.data, refStored.data, 2, cmask);
  const corrAvg = (corrR + corrG + corrB) / 3;
  const baseMap = verifyBase.heightMap;
  let dot = 0, na = 0, nb = 0, zn = 0;
  const npx = Math.min(heightMap.length, baseMap.length);
  for (let i = 0; i < npx; i++) {
    if (!heightMap[i] && !baseMap[i]) continue; // пропускаем невалидные границы
    dot += heightMap[i] * baseMap[i];
    na += heightMap[i] * heightMap[i];
    nb += baseMap[i] * baseMap[i];
    zn++;
  }
  const simZ = (zn > 100 && Math.sqrt(na) * Math.sqrt(nb) > 1e-9) ? dot / (Math.sqrt(na) * Math.sqrt(nb)) : 0;
  const metrics =
    `Фрагмент: ${(corrAvg * 100).toFixed(1)}% (R ${(corrR * 100).toFixed(0)}, G ${(corrG * 100).toFixed(0)}, B ${(corrB * 100).toFixed(0)}).\n` +
    `Рельеф: ${(simZ * 100).toFixed(1)}%. std(Z): тест ${stdZ.toFixed(2)} / эталон ${(verifyBase.stdZ || 0).toFixed(2)}.\n` +
    `Блики: ${(chosen.spec * 100).toFixed(0)}%. Пороги: фрагмент ≥ ${(CORR_MATCH * 100)}%, рельеф ≥ ${(SIMZ_MATCH * 100)}%.`;
  // п.19: решение о подлинности
  if (corrAvg >= CORR_MATCH && simZ >= SIMZ_MATCH) {
    await showModal('ОРИГИНАЛ', `Картина «${verifyBase.name}».\n${metrics}`);
  } else {
    const why = corrAvg < CORR_MATCH ? 'изображение зоны не совпадает с эталоном' : 'карта рельефа не совпадает с эталоном';
    await showModal('КОПИЯ', `${why.charAt(0).toUpperCase() + why.slice(1)}.\n${metrics}`);
  }
  goHome();
}

      function openDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE)) {
              db.createObjectStore(STORE, {
                keyPath: 'id',
                autoIncrement: true
              });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return dbPromise;
      }

      async function dbAdd(rec) {
        const db = await openDB();
        return new Promise((res, rej) => {
          const tx = db.transaction(STORE, 'readwrite');
          const r = tx.objectStore(STORE).add(rec);
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      }

      async function dbAll() {
        const db = await openDB();
        return new Promise((res, rej) => {
          const tx = db.transaction(STORE, 'readonly');
          const r = tx.objectStore(STORE).getAll();
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      }


      function showModal(title, text, opts = {}) {

        modalInput.value = '';

        });
      }


      function cosine(a, b) {
        if (!a || !b) return 0;
        const n = Math.min(a.length, b.length);
        if (n === 0) return 0;
        let dot = 0,
          na = 0,
          nb = 0;
        for (let i = 0; i < n; i++) {
          dot += a[i] * b[i];
          na += a[i] * a[i];
          nb += b[i] * b[i];
        }
        const denom = Math.sqrt(na) * Math.sqrt(nb);
        if (denom < 1e-9) return 0;
        return dot / denom;
      }


      function normalizeL2(vec) {
        if (!vec) return vec;
        let s = 0;
        for (let i = 0; i < vec.length; i++) s += vec[i] * vec[i];
        const n = Math.sqrt(s);
        if (n < 1e-9) return vec;
        const out = new Float32Array(vec.length);
        for (let i = 0; i < vec.length; i++) out[i] = vec[i] / n;
        return out;
      }

      async function startCamera() {
        if (stream) return;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: 'environment'
