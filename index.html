<content><!DOCTYPE html>
<html lang="ru">
<head>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: #fff;
font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
#app { position: relative; width: 100vw; height: 100vh; height: 100dvh;
display: flex; flex-direction: column; }

flex-direction: column; align-items: center; justify-content: center; z-index: 30; padding: 24px; }
#modal .card { background: #1c1c1e; padding: 20px; border-radius: 14px; width: 100%; max-width: 360px; }
#modal h2 { font-size: 18px; margin-bottom: 12px; text-align: center; }

#modal input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3a3a3c;
background: #2c2c2e; color: #fff; font-size: 16px; margin-bottom: 12px; }

<body>
<div id="app">

</div>

</div>
</div>

<button id="modalOk" class="primary">OK</button>
</div>
</div>
</div>
<script>
(() => {
const home = document.getElementById('home');
const homeStatus = document.getElementById('homeStatus');
const cameraEl = document.getElementById('camera');
const video = document.getElementById('video');
const videoWrap = document.getElementById('videoWrap');
const objectBox = document.getElementById('objectBox');
const entropyBox = document.getElementById('entropyBox');
const hint = document.getElementById('hint');
const status = document.getElementById('status');
const btnProtect = document.getElementById('btnProtect');
const btnVerify = document.getElementById('btnVerify');
const btnTorch = document.getElementById('btnTorch');
const btnShot = document.getElementById('btnShot');
const btnCancel = document.getElementById('btnCancel');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const modalInput = document.getElementById('modalInput');
const modalOk = document.getElementById('modalOk');

let stream = null, videoTrack = null, torchOn = false;
let mode = null;
let state = 'idle';
let analysisTimer = null, rafRunning = false;
let objectBoxFrac = null;
let lastEntropyBox = null;
let globalFeatures = null;
let verifyBase = null;
let shots = [];
let targetIndex = 0;
let cvReady = false;
const DB_NAME = 'art-inspector-db', STORE = 'paintings';
let dbPromise = null;
function openDB() {
if (dbPromise) return dbPromise;
dbPromise = new Promise((resolve, reject) => {
const req = indexedDB.open(DB_NAME, 1);
req.onupgradeneeded = () => {
const db = req.result;
if (!db.objectStoreNames.contains(STORE)) {
db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
}
};
req.onsuccess = () => resolve(req.result);
req.onerror = () => reject(req.error);
});
return dbPromise;
}
async function dbAdd(rec) {
const db = await openDB();
return new Promise((res, rej) => {
const tx = db.transaction(STORE, 'readwrite');
const r = tx.objectStore(STORE).add(rec);
r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
}
async function dbAll() {
const db = await openDB();
return new Promise((res, rej) => {
const tx = db.transaction(STORE, 'readonly');
const r = tx.objectStore(STORE).getAll();
r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
}
function showModal(title, text, opts = {}) {
modalTitle.textContent = title;
modalText.textContent = text || '';
modalInput.style.display = opts.input ? 'block' : 'none';
modalInput.value = '';
modalOk.textContent = opts.okText || 'OK';
modal.style.display = 'flex';
return new Promise((resolve) => {
modalOk.onclick = () => {
modal.style.display = 'none';
resolve(opts.input ? modalInput.value.trim() : true);
};
});
}
function setHint(t) { hint.textContent = t; }
function setStatus(t) { status.textContent = t; }
function cosine(a, b) {
if (!a || !b) return 0;
const n = Math.min(a.length, b.length);
if (n === 0) return 0;
let dot = 0, na = 0, nb = 0;
for (let i = 0; i < n; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
const denom = Math.sqrt(na) * Math.sqrt(nb);
if (denom < 1e-9) return 0;
return dot / denom;
}
function normalizeL2(vec) {
if (!vec) return vec;
let s = 0;
for (let i = 0; i < vec.length; i++) s += vec[i]*vec[i];
const n = Math.sqrt(s);
if (n < 1e-9) return vec;
const out = new Float32Array(vec.length);
for (let i = 0; i < vec.length; i++) out[i] = vec[i] / n;
return out;
}
function goHome() {
stopAnalysis();
stopCamera();
cameraEl.style.display = 'none';
home.style.display = 'flex';
objectBox.style.display = 'none';
entropyBox.style.display = 'none';
entropyBox.classList.remove('target');
mode = null; state = 'idle';
objectBoxFrac = null; lastEntropyBox = null; globalFeatures = null; verifyBase = null;
shots = []; targetIndex = 0;
btnTorch.textContent = 'Фонарик'; torchOn = false;
btnShot.disabled = false;
setHint(''); setStatus('');
}
async function startCamera() {
if (stream) return;
try {
stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
audio: false
});
} catch (e) {
console.error('getUserMedia error:', e);
throw new Error('Не удалось получить доступ к камере: ' + e.message);
}
video.srcObject = stream;
videoTrack = stream.getVideoTracks()[0];
// Таймаут ожидания готовности видео
await new Promise((resolve, reject) => {
  const timeout = setTimeout(() => {
    reject(new Error('Камера не запустилась (таймаут 5 сек)'));
  }, 5000);
  
  const check = () => {
    if (video.videoWidth > 0 && video.videoHeight > 0) {
      clearTimeout(timeout);
      resolve();
    } else {
      setTimeout(check, 100);
    }
  };
  check();
});
}
function stopCamera() {
if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; videoTrack = null; }
}
async function setTorch(on) {
if (!videoTrack) return false;
try {
const caps = videoTrack.getCapabilities?.() || {};
if (!caps.torch) return false;
await videoTrack.applyConstraints({ advanced: [{ torch: on }] });
torchOn = on;
btnTorch.textContent = on ? 'Фонарик ВКЛ' : 'Фонарик';
return true;
} catch (e) {
console.warn('setTorch error:', e);
return false;
}
}
function detectPainting() {
if (!cvReady || !window.cv) return null;
if (!video.videoWidth || !video.videoHeight) return null;
const cv = window.cv;
const W = 320, H = Math.round(320 * video.videoHeight / video.videoWidth);
const c = document.createElement('canvas');
c.width = W; c.height = H;
const ctx = c.getContext('2d');
if (!ctx) return null;

ctx.drawImage(video, 0, 0, W, H);

let src, gray, edges, contours, hierarchy;
try {
  src = cv.imread(c);
  gray = new cv.Mat();
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
  edges = new cv.Mat();
  cv.Canny(gray, edges, 30, 100);
  const kernel = cv.Mat.ones(5, 5, cv.CV_8U);
  cv.dilate(edges, edges, kernel);
  cv.erode(edges, edges, kernel);
  kernel.delete();
  contours = new cv.MatVector();
  hierarchy = new cv.Mat();
  cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
  
  let best = null, bestArea = 0;
  const imgArea = W * H;
  
  for (let i = 0; i < contours.size(); i++) {
    const cnt = contours.get(i);
    const area = cv.contourArea(cnt);
    if (area < imgArea * 0.15 || area > imgArea * 0.95) { cnt.delete(); continue; }
    
    const peri = cv.arcLength(cnt, true);
    const approx = new cv.Mat();
    cv.approxPolyDP(cnt, approx, 0.04 * peri, true);
    
    if (approx.rows === 4 && area > bestArea) {
      const pts = [];
      for (let j = 0; j < 4; j++) pts.push({ x: approx.data32S[j*2], y: approx.data32S[j*2+1] });
      
      let isRectangular = true;
      for (let j = 0; j < 4; j++) {
        const p1 = pts[j], p2 = pts[(j+1)%4], p3 = pts[(j+2)%4];
        const v1 = { x: p2.x - p1.x, y: p2.y - p1.y };
        const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
        const dot = v1.x*v2.x + v1.y*v2.y;
        const len1 = Math.sqrt(v1.x*v1.x + v1.y*v1.y);
        const len2 = Math.sqrt(v2.x*v2.x + v2.y*v2.y);
        const angle = Math.abs(Math.acos(Math.max(-1, Math.min(1, dot / (len1*len2 + 1e-9)))) * 180 / Math.PI);
        if (angle < 60 || angle > 120) { isRectangular = false; break; }
      }
      
      if (isRectangular) {
        bestArea = area;
        if (best) best.delete();
        best = approx;
      } else {
        approx.delete();
      }
    } else {
      approx.delete();
    }
    cnt.delete();
  }
  
  let result = null;
  if (best) {
    const pts = [];
    for (let i = 0; i < 4; i++) pts.push({ x: best.data32S[i*2], y: best.data32S[i*2+1] });
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    result = { fx: minX/W, fy: minY/H, fw: (maxX-minX)/W, fh: (maxY-minY)/H,
               areaFrac: bestArea / imgArea };
    best.delete();
  }
  return result;
} catch (e) {
  console.warn('detectPainting error:', e);
  return null;
} finally {
  try {
    src && src.delete(); gray && gray.delete(); edges && edges.delete();
    contours && contours.delete(); hierarchy && hierarchy.delete();
  } catch (e) {}
}
}
function computeGeometry() {
const cw = videoWrap.clientWidth, ch = videoWrap.clientHeight;
const vw = video.videoWidth, vh = video.videoHeight;
if (!cw || !ch || !vw || !vh) return null;
const va = vw/vh, ca = cw/ch;
let drawW, drawH, offX, offY;
if (va > ca) {
drawW = cw; drawH = cw / va; offX = 0; offY = (ch - drawH) / 2;
} else {
drawH = ch; drawW = ch * va; offX = (cw - drawW) / 2; offY = 0;
}
return { cw, ch, drawW, drawH, offX, offY };
}
function frameToPainting(fx, fy, fw, fh) {
if (!objectBoxFrac) return { fx, fy, fw, fh };
const ob = objectBoxFrac;
return { fx: (fx - ob.fx) / ob.fw, fy: (fy - ob.fy) / ob.fh,
fw: fw / ob.fw, fh: fh / ob.fh };
}
function paintingToFrame(px, py, pw, ph) {
if (!objectBoxFrac) return { fx: px, fy: py, fw: pw, fh: ph };
const ob = objectBoxFrac;
return { fx: ob.fx + px * ob.fw, fy: ob.fy + py * ob.fh,
fw: pw * ob.fw, fh: ph * ob.fh };
}
function refreshEntropyBoxFromBase() {
if (!lastEntropyBox || !lastEntropyBox._base) return;
const cur = paintingToFrame(lastEntropyBox._base.fx, lastEntropyBox._base.fy,
lastEntropyBox._base.fw, lastEntropyBox._base.fh);
lastEntropyBox.fx = cur.fx; lastEntropyBox.fy = cur.fy;
lastEntropyBox.fw = cur.fw; lastEntropyBox.fh = cur.fh;
}
function renderBoxes() {
const g = computeGeometry();
if (!g) return;
if (objectBoxFrac && (state === 'detect' || state === 'entropy')) {
  objectBox.style.display = 'block';
  objectBox.style.left   = (g.offX + objectBoxFrac.fx * g.drawW) + 'px';
  objectBox.style.top    = (g.offY + objectBoxFrac.fy * g.drawH) + 'px';
  objectBox.style.width  = (objectBoxFrac.fw * g.drawW) + 'px';
  objectBox.style.height = (objectBoxFrac.fh * g.drawH) + 'px';
} else {
  objectBox.style.display = 'none';
}

if (lastEntropyBox) refreshEntropyBoxFromBase();
if (lastEntropyBox) {
  entropyBox.style.display = 'block';
  entropyBox.style.left   = (g.offX + lastEntropyBox.fx * g.drawW) + 'px';
  entropyBox.style.top    = (g.offY + lastEntropyBox.fy * g.drawH) + 'px';
  entropyBox.style.width  = (lastEntropyBox.fw * g.drawW) + 'px';
  entropyBox.style.height = (lastEntropyBox.fh * g.drawH) + 'px';
} else entropyBox.style.display = 'none';
}
function startRenderLoop() {
if (rafRunning) return;
rafRunning = true;
const loop = () => { renderBoxes(); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
}
let analysisCanvas = document.createElement('canvas');
let analysisCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });
function startAnalysis() {
stopAnalysis();
analysisTimer = setInterval(onAnalysisTick, 300);
}
function stopAnalysis() {
if (analysisTimer) { clearInterval(analysisTimer); analysisTimer = null; }
}
let detectCounter = 0;
function onAnalysisTick() {
if (!video.videoWidth || video.readyState < 2) return;  
if (state === 'detect' && ++detectCounter % 3 === 0) {
  try {
    const det = detectPainting();
    if (det) {
      objectBoxFrac = det;
      setHint(`Картина обнаружена (${Math.round(det.areaFrac*100)}%). Приближайтесь.`);
      
      if (det.areaFrac >= 0.70) {
        globalFeatures = extractGlobalFeatures();
        if (mode === 'verify') {
          handleVerifyLookup();
        } else {
          state = 'entropy';
          setHint('Ищем самую информативную зону…');
        }
      }
    } else {
      setHint('Наведите камеру на картину…');
    }
  } catch (e) {
    console.warn('onAnalysisTick error:', e);
  }
  return;
}

if (state === 'entropy') {
  try {
    computeEntropyBox();
  } catch (e) {
    console.warn('computeEntropyBox error:', e);
  }
}  
}
function extractGlobalFeatures() {
const W = 256, H = Math.max(1, Math.round(256 * video.videoHeight / video.videoWidth));
if (analysisCanvas.width !== W || analysisCanvas.height !== H) {
analysisCanvas.width = W; analysisCanvas.height = H;
}
analysisCtx.drawImage(video, 0, 0, W, H);
const data = analysisCtx.getImageData(0, 0, W, H).data;
const fx = 8, fy = 8, out = new Float32Array(fxfy);
const bw = Math.floor(W/fx), bh = Math.floor(H/fy);
for (let by = 0; by < fy; by++) for (let bx = 0; bx < fx; bx++) {
let sum = 0, n = 0;
for (let y = bybh; y < (by+1)bh; y++)
for (let x = bxbw; x < (bx+1)bw; x++) {
const i = (yW + x) * 4;
sum += 0.299data[i] + 0.587data[i+1] + 0.114data[i+2];
n++;
}
out[byfx+bx] = sum / n;
}
return normalizeL2(out);
}
function computeEntropyBox() {
const W = 256, H = Math.max(1, Math.round(256 * video.videoHeight / video.videoWidth));
if (analysisCanvas.width !== W || analysisCanvas.height !== H) {
analysisCanvas.width = W; analysisCanvas.height = H;
}
analysisCtx.drawImage(video, 0, 0, W, H);
let data;
try { data = analysisCtx.getImageData(0, 0, W, H).data; }
catch (e) { setStatus('getImageData error'); return; } 
const blockSize = 32;
const cols = Math.floor(W/blockSize), rows = Math.floor(H/blockSize);

let restrict;
if (!lastEntropyBox) {
  restrict = { x0: 0, y0: 0, x1: 1, y1: 1 };
} else {
  const cur = paintingToFrame(lastEntropyBox._base.fx, lastEntropyBox._base.fy,
                              lastEntropyBox._base.fw, lastEntropyBox._base.fh);
  const pad = 0.3;
  restrict = {
    x0: Math.max(0, cur.fx - cur.fw * pad),
    y0: Math.max(0, cur.fy - cur.fh * pad),
    x1: Math.min(1, cur.fx + cur.fw * (1 + pad)),
    y1: Math.min(1, cur.fy + cur.fh * (1 + pad))
  };
}

let best = -1, bb = null;
for (let by = 0; by < rows; by++) for (let bx = 0; bx < cols; bx++) {
  const fx = bx*blockSize/W, fy = by*blockSize/H;
  const fw = blockSize/W, fh = blockSize/H;
  const cx = fx + fw/2, cy = fy + fh/2;
  if (cx < restrict.x0 || cx > restrict.x1 || cy < restrict.y0 || cy > restrict.y1) continue;
  
  const hist = new Float32Array(256); let count = 0;
  for (let y = 0; y < blockSize; y++) for (let x = 0; x < blockSize; x++) {
    const px = bx*blockSize + x, py = by*blockSize + y;
    const idx = (py*W + px) * 4;
    const lum = (0.299*data[idx] + 0.587*data[idx+1] + 0.114*data[idx+2]) | 0;
    hist[lum]++; count++;
  }
  
  let ent = 0;
  for (let i = 0; i < 256; i++) if (hist[i]) { const p = hist[i]/count; ent -= p*Math.log2(p); }
  if (ent > best) { best = ent; bb = { fx, fy, fw, fh }; }
}

if (!bb) return;

const inPainting = frameToPainting(bb.fx, bb.fy, bb.fw, bb.fh);
if (!lastEntropyBox) {
  lastEntropyBox = {
    fx: bb.fx, fy: bb.fy, fw: bb.fw, fh: bb.fh,
    entropy: best,
    _base: inPainting
  };
} else {
  const a = 0.2;
  lastEntropyBox._base.fx = lastEntropyBox._base.fx * (1 - a) + inPainting.fx * a;
  lastEntropyBox._base.fy = lastEntropyBox._base.fy * (1 - a) + inPainting.fy * a;
  lastEntropyBox._base.fw = inPainting.fw;
  lastEntropyBox._base.fh = inPainting.fh;
  lastEntropyBox.entropy = best;
  refreshEntropyBoxFromBase();
}

setStatus(`Энтропия: ${best.toFixed(2)} бит`);
setHint('Приблизьтесь и нажмите «Фото». Рамка будет смещаться — двигайте камеру за ней.'); 
}
async function handleVerifyLookup() {
state = 'shoot_ready';
btnShot.disabled = true;
setHint('Ищем картину в базе…');
if (!globalFeatures) {
  await showModal('Ошибка', 'Не удалось извлечь признаки картины.');
  goHome();
  return;
}

let list = [];
try { list = await dbAll(); } catch (e) { list = []; }
if (!list.length) {
  await showModal('Не найдено', 'В локальной базе нет защищённых картин.');
  goHome();
  return;
}

let best = null, bestSim = -1;
for (const rec of list) {
  const sim = cosine(globalFeatures, rec.globalFeatures);
  if (sim > bestSim) { bestSim = sim; best = rec; }
}

if (!best) best = list[0];
if (!best.zoneCoords) {
  await showModal('Ошибка', 'В записи нет координат контрольной зоны.');
  goHome();
  return;
}

verifyBase = best;

function buildHeightMap(shts) {

  aligned.push(alignShotToRef(valid[i], ref));

const out = new Float32Array(W*H);
