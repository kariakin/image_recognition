    (() => {
// ==========================================================================
//  Art Inspector — логика приложения (реализация по спецификации README.md)
//
//  Состояния: idle -> detect -> (protect: zone_search | verify: lookup)
//             -> locked -> shoot -> process
// ==========================================================================

// ---------- Версия ----------
const BUILD_STAMP = '02.11.2026 05:43 (Asia/Shanghai)';
console.log('Art Inspector — сборка ' + BUILD_STAMP);

// ---------- DEBUG LOG ----------
const debugLogEl = document.getElementById('debugLog');
const debugToggleEl = document.getElementById('debugToggle');
const DEBUG_MAX_CHARS = 30000;
let debugVisible = false;

// Показываем кнопку debug на экране камеры и главном меню
function setDebugToggleVisible(v) {
  debugToggleEl.classList.toggle('visible', v);
}
debugToggleEl.onclick = () => {
  debugVisible = !debugVisible;
  debugLogEl.classList.toggle('visible', debugVisible);
  debugToggleEl.textContent = debugVisible ? '✕' : '🐞';
};

function logLine(level, args) {
  const ts = new Date().toISOString().slice(11, 23);
  const text = args.map(a => {
    if (typeof a === 'object' && a !== null) {
      try { return JSON.stringify(a); } catch (e) { return String(a); }
    }
    return String(a);
  }).join(' ');
  const line = `[${ts}] ${level ? level + ' ' : ''}${text}`;
  // консоль
  if (level === 'ERR') console.error(line);
  else if (level === 'WARN') console.warn(line);
  else console.log(line);
  // экран
  if (!debugLogEl) return;
  const span = document.createElement('div');
  if (level === 'WARN') span.className = 'warn';
  else if (level === 'ERR') span.className = 'err';
  else if (level === 'INFO') span.className = 'info';
  span.textContent = line;
  debugLogEl.appendChild(span);
  // обрезаем
  while (debugLogEl.textContent.length > DEBUG_MAX_CHARS && debugLogEl.firstChild) {
    debugLogEl.removeChild(debugLogEl.firstChild);
  }
  if (debugVisible) debugLogEl.scrollTop = debugLogEl.scrollHeight;
}
function log(...args) { logLine('', args); }
function logWarn(...args) { logLine('WARN', args); }
function logErr(...args) { logLine('ERR', args); }
function logInfo(...args) { logLine('INFO', args); }

// Перехватываем стандартные console.* для отображения на экране
(function hookConsole() {
  const origLog = console.log.bind(console);
  const origWarn = console.warn.bind(console);
  const origErr = console.error.bind(console);
  console.log = (...a) => { try { logLine('', a); } catch (e) { origLog(...a); } };
  console.warn = (...a) => { try { logLine('WARN', a); } catch (e) { origWarn(...a); } };
  console.error = (...a) => { try { logLine('ERR', a); } catch (e) { origErr(...a); } };
})();

// ---------- DOM ----------
const home = document.getElementById('home');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingTitle = document.getElementById('loadingTitle');
const loadingSubtitle = document.getElementById('loadingSubtitle');
const progressBar = document.getElementById('progressBar');
const progressInfo = document.getElementById('progressInfo');
const cameraEl = document.getElementById('camera');
const video = document.getElementById('video');
const videoWrap = document.getElementById('videoWrap');
const objectBox = document.getElementById('objectBox');
const entropyBox = document.getElementById('entropyBox');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');
const btnProtect = document.getElementById('btnProtect');
const btnVerify = document.getElementById('btnVerify');
const btnTorch = document.getElementById('btnTorch');
const btnShot = document.getElementById('btnShot');
const btnCancel = document.getElementById('btnCancel');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const modalInput = document.getElementById('modalInput');
const modalOk = document.getElementById('modalOk');

// ---------- Константы алгоритма ----------
const DB_NAME = 'art-inspector-db', STORE = 'paintings';
const TICK_MS = 350;
const FRAME_W = 256;
const TRACK_W = 160;
const FILL_AREA = 0.85;
const EDGE_TOL = 0.07;
const FILL_HITS = 3;
const DETECT_TIMEOUT_MS = 20000;
const BLOCK = 28;
const MIN_ENTROPY = 4.6;
const ZONE_FRAC = 0.24;
const CENTER_MARGIN = 0.16;
const ZONE_STABLE_HITS = 4;
const TRACK_SCALES = [0.85, 1.0, 1.18, 1.4];
const TRACK_SCALES_WIDE = [0.7, 1.0, 1.4, 1.9];
const TRACK_MIN_SCORE = 0.40;
const TRACK_MIN_SCORE2 = 0.50;
const ROI_PAD = 1.5;
const LAP_MIN = 35;
const READY_SIDE = 0.28;
const FEATURE_MATCH = 0.78;
const HEIGHT_STD = 3.0;
const CORR_MATCH = 0.80;
const SIMZ_MATCH = 0.55;
const TMPL = 96;
// порог приближения к зоне: пока зона меньше — обновляем paintBox по краям картины
const PAINT_FREEZE_SIDE = 0.50;

// ---------- Состояние ----------
let stream = null, videoTrack = null, torchOn = false;
let mode = null;
let state = 'idle';
let tickTimer = null, tickBusy = false, tickCount = 0;
let rafRunning = false;
let cvReady = false;

let detectStartedAt = 0;
let paintBox = null;
let paintHits = 0, paintMisses = 0;
let boundaryVisible = false;
let paintFillsFrame = false;
let boundaryPhase = true;
let tmplSide = 0;
let tmplRefreshTick = -99;
let fillHits = 0;

let zoneEMA = null;
let zoneBase = null;
let zoneStable = 0, zoneEntropy = 0;
let trackBox = null;
let trackMisses = 0, lastTrackScore = 0;
let dispBox = null;
let tmplData = null;
let tmplMat = null;

let globalFeatures = null;
let verifyBase = null;
let baseSim = null;
let shots = [];
let targetIndex = 0;

let dbPromise = null;

// ---------- Рабочие canvas ----------
// Важно: каждый grabFrame создаёт СВОЙ canvas, чтобы matchAt не читал чужой.
const workCanvas = document.createElement('canvas');
const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });
const cropCanvas = document.createElement('canvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
const tmpCanvas = document.createElement('canvas');
const tmpCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });

function setCanvas(cv2, w, h) {
  if (cv2.width !== w || cv2.height !== h) { cv2.width = w; cv2.height = h; }
}

// ---------- Мелкие утилиты ----------
function setHint(t) { hint.textContent = t; }
function setStatus(t) { statusEl.textContent = t; }

function emaBox(a, b, k) {
  return {
    fx: a.fx * (1 - k) + b.fx * k,
    fy: a.fy * (1 - k) + b.fy * k,
    fw: a.fw * (1 - k) + b.fw * k,
    fh: a.fh * (1 - k) + b.fh * k,
    areaFrac: (b.areaFrac != null ? b.areaFrac : a.areaFrac),
    score: (b.score != null ? b.score : a.score)
  };
}
function lerpBox(a, b, k) {
  return {
    fx: a.fx + (b.fx - a.fx) * k, fy: a.fy + (b.fy - a.fy) * k,
    fw: a.fw + (b.fw - a.fw) * k, fh: a.fh + (b.fh - a.fh) * k
  };
}
function grayOf(d, i) { return 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; }

function specFracOf(d) {
  let c = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    n++;
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const mx = Math.max(r, g, b);
    if (mx > 246 && Math.abs(r - g) < 14 && Math.abs(g - b) < 14 && Math.abs(r - b) < 14) c++;
  }
  return n ? c / n : 1;
}

function patchStats64(imgData) {
  const S = imgData.width, d = imgData.data;
  const g = new Float32Array(S * S);
  let sum = 0;
  for (let i = 0, p = 0; i < g.length; i++, p += 4) { g[i] = grayOf(d, p); sum += g[i]; }
  const m = sum / g.length;
  let v = 0;
  for (let i = 0; i < g.length; i++) v += (g[i] - m) * (g[i] - m);
  const lumStd = Math.sqrt(v / g.length);
  let ls = 0, ls2 = 0, n = 0;
  for (let y = 1; y < S - 1; y++) for (let x = 1; x < S - 1; x++) {
    const lap = 4 * g[y * S + x] - g[y * S + x - 1] - g[y * S + x + 1] -
      g[(y - 1) * S + x] - g[(y + 1) * S + x];
    ls += lap; ls2 += lap * lap; n++;
  }
  const lm = ls / n;
  return { lumStd, lapVar: Math.max(0, ls2 / n - lm * lm) };
}

// ---------- Кадр: даунскейл + серая шкала (с собственным canvas) ----------
function grabFrame(W) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const H = Math.max(1, Math.round(W * vh / vw));
  const cnv = document.createElement('canvas');
  cnv.width = W; cnv.height = H;
  const ctx = cnv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, W, H);
  const rgba = ctx.getImageData(0, 0, W, H).data;
  const gray = new Uint8ClampedArray(W * H);
  for (let i = 0, p = 0; i < gray.length; i++, p += 4) gray[i] = grayOf(rgba, p);
  return { W, H, gray, rgba, canvas: cnv };
}

// ==========================================================================
//  П.2/11 — обнаружение картины
// ==========================================================================
function medianGray(gray) {
  const s = [];
  for (let i = 0; i < gray.length; i += 17) s.push(gray[i]);
  s.sort((a, b) => a - b);
  return s.length ? s[s.length >> 1] : 128;
}

function detectBounds() {
  if (!cvReady || !window.cv || !video.videoWidth) return null;
  const fr = grabFrame(FRAME_W);
  const cv = window.cv;
  let src = null, gray = null, blur = null, edges = null, kernel = null;
  try {
    src = new cv.Mat(fr.H, fr.W, cv.CV_8UC4);
    src.data.set(fr.rgba);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    blur = new cv.Mat();
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
    const med = medianGray(fr.gray);
    const lo = Math.max(20, Math.min(110, Math.round(med * 0.6)));
    const hi = Math.max(60, Math.min(220, Math.round(med * 1.6)));
    edges = new cv.Mat();
    kernel = cv.Mat.ones(3, 3, cv.CV_8U);
    let r = scanQuads(cv, edges, kernel, blur, lo, hi, fr);
    if (!r.best && !r.sawFill) {
      r = scanQuads(cv, edges, kernel, blur,
        Math.max(8, Math.round(lo * 0.45)), Math.max(28, Math.round(hi * 0.45)), fr);
    }
    // диагностика (раз в ~2 сек, чтобы не спамить)
    if (tickCount % 6 === 0) {
      logInfo('detect', {
        med,
        lo, hi,
        bestScore: r.best ? Math.round(r.best.score) : null,
        bestArea: r.best ? +(r.best.areaFrac * 100).toFixed(1) : null,
        sawFill: r.sawFill
      });
    }
    if (!r.best && r.sawFill) return { fills: true };
    return r.best;
  } catch (e) {
    console.warn('detectBounds:', e.message || e);
    return null;
  } finally {
    try {
      if (src) src.delete();
      if (gray) gray.delete();
      if (blur) blur.delete();
      if (edges) edges.delete();
      if (kernel) kernel.delete();
    } catch (e) {}
  }
}

function scanQuads(cv, edges, kernel, blur, lo, hi, fr) {
  let contours = null, hierarchy = null;
  try {
    cv.Canny(blur, edges, lo, hi);
    cv.dilate(edges, edges, kernel);
    cv.dilate(edges, edges, kernel);
    cv.erode(edges, edges, kernel);
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
    const imgArea = fr.W * fr.H;
    let best = null, sawFill = false;
    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i);
      let approx = null;
      try {
        const area = cv.contourArea(cnt);
        if (area < imgArea * 0.05) continue;

        const peri = cv.arcLength(cnt, true);
        approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.045 * peri, true);
        const rows = approx.rows;
        if (rows < 4 || rows > 6) continue;
        const pts = [];
        for (let j = 0; j < rows; j++) pts.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
        let shapeOk = true;
        if (rows === 4) {
          for (let j = 0; j < 4; j++) {
            const p1 = pts[j], p2 = pts[(j + 1) % 4], p3 = pts[(j + 2) % 4];
            const v1x = p2.x - p1.x, v1y = p2.y - p1.y;
            const v2x = p3.x - p2.x, v2y = p3.y - p2.y;
            const dot = v1x * v2x + v1y * v2y;
            const l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
            const ang = Math.abs(Math.acos(Math.max(-1, Math.min(1, dot / (l1 * l2 + 1e-9)))) * 180 / Math.PI);
            if (ang < 55 || ang > 125) { shapeOk = false; break; }
          }
        }
        if (!shapeOk) continue;
        const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        const bw = maxX - minX, bh = maxY - minY;
        if (bw < 12 || bh < 12) continue;
        if (Math.max(bw, bh) / Math.min(bw, bh) > 4.5) continue;
        const fill = area / (bw * bh);
        if (fill < (rows === 4 ? 0.62 : 0.78)) continue;
        const ccx = (minX + maxX) / 2 / fr.W, ccy = (minY + maxY) / 2 / fr.H;
        const centrality = 1 - Math.min(1, Math.hypot(ccx - 0.5, ccy - 0.5) / 0.7);
        const score = area * fill * (0.7 + 0.3 * centrality) * (rows === 4 ? 1.0 : 0.85);
        if (!best || score > best.score) {
          best = {
            fx: minX / fr.W, fy: minY / fr.H, fw: bw / fr.W, fh: bh / fr.H,
            areaFrac: area / imgArea, score
          };
        }

        // Признак "картина заполняет кадр": валидный контур, большой bbox,
        // упирается в ≥2 края кадра. НЕ отбрасываем контур — только помечаем.
        const touchesEdges =
          (minX <= fr.W * 0.01 ? 1 : 0) + (minY <= fr.H * 0.01 ? 1 : 0) +
          (maxX >= fr.W * 0.99 ? 1 : 0) + (maxY >= fr.H * 0.99 ? 1 : 0);
        const bboxFill = (maxX - minX) * (maxY - minY) / imgArea;
        if (touchesEdges >= 2 && bboxFill >= 0.88 && area >= imgArea * 0.60) {
          sawFill = true;
        }
      } finally {
        if (approx) approx.delete();
        cnt.delete();
      }
    }
    return { best, sawFill };
  } finally {
    try {
      if (contours) contours.delete();
      if (hierarchy) hierarchy.delete();
    } catch (e) {}
  }
}

function looksLikeFills() {
  if (!paintBox) return false;
  if (paintBox.areaFrac >= 0.60) return true;
  const b = paintBox;
  const touches = (b.fx < 0.05 ? 1 : 0) + (b.fy < 0.05 ? 1 : 0) +
    (b.fx + b.fw > 0.95 ? 1 : 0) + (b.fy + b.fh > 0.95 ? 1 : 0);
  return touches >= 2 && b.areaFrac >= 0.40;
}

function updateBoundary() {
  if (!boundaryPhase) return null;
  const det = detectBounds();
  if (det && det.fills) {
    paintHits = 0; paintMisses = 0;
    boundaryVisible = false;
    paintFillsFrame = true;
    detectStartedAt = Date.now();
    return det;
  }
  if (det) {
    if (paintBox && paintBox.areaFrac >= 0.30 && det.areaFrac < paintBox.areaFrac * 0.55 && paintMisses < 6) {
      paintMisses++; paintHits = 0;
      if (paintMisses >= 4) boundaryVisible = false;
      return null;
    }
    paintHits++; paintMisses = 0;
    if (paintHits >= 2) {
      paintBox = paintBox ? emaBox(paintBox, det, 0.45) : Object.assign({}, det);
      boundaryVisible = true;
      paintFillsFrame = false;
      detectStartedAt = Date.now();
    }
  } else {
    paintMisses++; paintHits = 0;
    if (paintMisses >= 4) boundaryVisible = false;
    if (paintBox && paintMisses >= 2 && paintBox.areaFrac >= 0.75) {
      return { fills: true };
    }
  }
  return det;
}

function boxNearFrameEdges(b) {
  return b.fx <= EDGE_TOL && b.fy <= EDGE_TOL &&
    (b.fx + b.fw) >= 1 - EDGE_TOL && (b.fy + b.fh) >= 1 - EDGE_TOL;
}

function transitionToFills(fullFrame) {
  fillHits = 0;
  const reuse = !fullFrame && paintBox && paintBox.areaFrac >= 0.75;
  if (!reuse) {
    paintBox = { fx: 0, fy: 0, fw: 1, fh: 1, areaFrac: 1 };
  }
  // boundaryPhase = false ставим НЕ здесь, а когда пользователь уже приблизился
  // (см. tickLocked / tickShoot). Пока зона маленькая — продолжаем трекать края,
  // чтобы paintBox оставался актуальным и зона «не плыла» вместе с камерой.
  boundaryVisible = false;
  paintFillsFrame = true;
}
